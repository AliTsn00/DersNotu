# Android uygulamasını (APK) derler ve indirilebilir bir sürüm olarak yayınlar.
#
# GitHub'ın çalıştırıcılarında Android SDK hazır geldiği için derleme burada
# yapılır. Sonuç sabit bir adrese yüklenir:
#   https://github.com/<kullanıcı>/<repo>/releases/download/apk/ders-notu.apk
#
# Kurulum: telefonda bu adresi açın, indirin, "bilinmeyen kaynak" iznini verin.
# APK hata ayıklama anahtarıyla imzalıdır; Play Store'a yüklenemez, elden
# kurulum için yeterlidir.

name: APK

on:
  workflow_dispatch:
  push:
    branches: [main, claude/lecture-audio-notes-app-kkskgk]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test

      - name: Web derlemesi
        run: npm run build

      - name: Android projesini eşitle
        run: npx cap sync android

      - name: APK derle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Dosyayı adlandır
        run: |
          mkdir -p cikti
          cp android/app/build/outputs/apk/debug/app-debug.apk cikti/ders-notu.apk
          ls -lh cikti/

      - uses: actions/upload-artifact@v4
        with:
          name: ders-notu-apk
          path: cikti/ders-notu.apk

      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "apk" etiketi sabittir; indirme adresi her derlemede aynı kalır.
          gh release view apk >/dev/null 2>&1 || \
            gh release create apk \
              --target "${GITHUB_SHA}" \
              --title "Ders Notu — Android" \
              --notes "Telefona elden kurulum için APK. Her derlemede bu dosya güncellenir."
          gh release upload apk cikti/ders-notu.apk --clobber
          echo "İndirme adresi: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/ders-notu.apk"
